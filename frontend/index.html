<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>상품 관리 대시보드</title>
    <!-- FontAwesome 아이콘 CDN -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- CSS 파일 연결 -->
    <link rel="stylesheet" href="./css/index.css">
</head>

<body>
    <div class="app-container">
        <!-- 상단 헤더 배너 -->
        <header class="dashboard-header">
            <div class="header-subtitle">PRODUCT MANAGEMENT SYSTEM</div>
            <h1 class="header-title">상품 관리 대시보드</h1>
            <p class="header-desc">상품 등록부터 재고 관리까지 한 곳에서 관리합니다.</p>
        </header>

        <!-- 메인 콘텐츠 영역 -->
        <main class="dashboard-main">
            <!-- 요약 카드 섹션 (4개) -->
            <section class="summary-grid">
                <div class="summary-card">
                    <span class="card-label">전체 상품</span>
                    <div class="card-value">4<span class="card-unit">개</span></div>
                </div>
                <div class="summary-card">
                    <span class="card-label">총 재고 수량</span>
                    <div class="card-value">55<span class="card-unit">개</span></div>
                </div>
                <div class="summary-card">
                    <span class="card-label">재고 부족</span>
                    <div class="card-value text-danger">1<span class="card-unit">10개 미만</span></div>
                </div>
                <div class="summary-card">
                    <span class="card-label">재고 자산 금액</span>
                    <div class="card-value">850만<span class="card-unit">원</span></div>
                </div>
            </section>

            <!-- 상품 목록 섹션 -->
            <section class="product-section">
                <div class="section-header">
                    <h2>상품 목록</h2>
                    <span class="badge-count">4개</span>
                </div>

                <!-- 검색 및 필터 툴바 -->
                <div class="toolbar">
                    <div class="search-box">
                        <i class="fa-solid fa-magnifying-glass search-icon"></i>
                        <input type="text" placeholder="상품명 또는 상품 코드 검색">
                    </div>
                    <div class="filter-actions">
                        <div class="select-box">
                            <select>
                                <option>전체 카테고리</option>
                            </select>
                            <i class="fa-solid fa-chevron-down select-arrow"></i>
                        </div>
                        <button class="btn-primary">
                            <i class="fa-solid fa-plus"></i> 상품 등록
                        </button>
                    </div>
                </div>

                <!-- 상품 목록 리스트 -->
                <div class="product-list">
                    <!-- 상품 카드 아이템 -->
                    <div class="product-card">
                        <div class="product-main-info">
                            <div class="product-left">
                                <input type="checkbox" class="product-checkbox">
                                <div class="product-details">
                                    <div class="product-title-row">
                                        <h3 class="product-name">삼성 모니터</h3>
                                        <span class="badge-status">판매중</span>
                                    </div>
                                    <p class="product-meta">P001 · 전자제품</p>
                                    <p class="product-supplier">공급업체: 삼성전자</p>
                                </div>
                            </div>
                            <div class="product-right">
                                <div class="product-price">250,000원</div>
                                <div class="product-stock text-success">재고 30개</div>
                            </div>
                        </div>
                        <div class="product-footer">
                            <div class="action-buttons">
                                <button class="btn-action btn-edit">
                                    <i class="fa-solid fa-pen"></i> 수정
                                </button>
                                <button class="btn-action btn-delete">
                                    <i class="fa-solid fa-trash-can"></i> 삭제
                                </button>
                            </div>
                        </div>
                    </div>
                </div>
            </section>
        </main>
    </div>

    <!-- JS 파일 연결 -->
    <script src="./js/data_api.js"></script>
</body>

</html>
