<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>상품 관리 대시보드</title>
    <!-- FontAwesome 아이콘 CDN -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- CSS 파일 연결 -->
    <link rel="stylesheet" href="./css/index.css">
    <link rel="stylesheet" href="./css/modal.css">
</head>

<body>
    <div class="app-container">
        <!-- 상단 헤더 배너 -->
        <header class="dashboard-header">
            <div class="header-subtitle">PRODUCT MANAGEMENT SYSTEM</div>
            <h1 class="header-title">상품 관리 대시보드</h1>
            <p class="header-desc">상품 등록부터 재고 관리까지 한 곳에서 관리합니다.</p>
        </header>

        <!-- 메인 콘텐츠 영역 -->
        <main class="dashboard-main">
            <!-- 요약 카드 섹션 (4개) -->
            <section class="summary-grid">
                <div class="summary-card">
                    <span class="card-label">전체 상품</span>
                    <div class="card-value"><span class="card-unit">개</span></div>
                </div>
                <div class="summary-card">
                    <span class="card-label">총 재고 수량</span>
                    <div class="card-value"><span class="card-unit">개</span></div>
                </div>
                <div class="summary-card">
                    <span class="card-label">재고 부족</span>
                    <div class="card-value text-danger"><span class="card-unit">10개 미만</span></div>
                </div>
                <div class="summary-card">
                    <span class="card-label">재고 자산 금액</span>
                    <div class="card-value"><span class="card-unit">원</span></div>
                </div>
            </section>

            <!-- 상품 목록 섹션 -->
            <section class="product-section">
                <div class="section-header">
                    <h2>상품 목록</h2>
                    <span class="badge-count">개</span>
                </div>

                <!-- 검색 및 필터 툴바 -->
                <div class="toolbar">
                    <div class="search-box">
                        <i class="fa-solid fa-magnifying-glass search-icon"></i>
                        <input type="text" placeholder="상품명 또는 상품 코드 검색" id="searchInput">
                    </div>

                    <div class="filter-actions">
                        <!-- 1. 카테고리 필터 -->
                        <div class="select-box">
                            <select id="categorySelect">
                                <option value="전체 카테고리">전체 카테고리</option>
                            </select>
                            <i class="fa-solid fa-chevron-down select-arrow"></i>
                        </div>

                        <!-- 2. 판매 상태 필터 (전체 / 판매중 / 판매중지) -->
                        <div class="select-box">
                            <select id="statusSelect">
                                <option value="전체 상태">전체 상태</option>
                                <option value="판매중">판매중</option>
                                <option value="판매중지">판매중지</option>
                            </select>
                            <i class="fa-solid fa-chevron-down select-arrow"></i>
                        </div>

                        <!-- 3. 정렬 옵션 (기본순, 가격순, 재고순) -->
                        <div class="select-box">
                            <select id="sortSelect">
                                <option value="latest">최신 등록순</option>
                                <option value="price-asc">가격 낮은순</option>
                                <option value="price-desc">가격 높은순</option>
                                <option value="stock-desc">재고 많은순</option>
                                <option value="stock-asc">재고 적은순</option>
                            </select>
                            <i class="fa-solid fa-chevron-down select-arrow"></i>
                        </div>

                        <button class="btn-primary" id="openCreateModalBtn">
                            <i class="fa-solid fa-plus"></i> 상품 등록
                        </button>
                    </div>
                </div>

                <!-- 상품 목록 리스트 -->
                <div class="product-list">
                    <!-- 상품 카드 아이템들이 동적으로 렌더링됩니다 -->
                </div>

                <!-- [추가] 4. 페이지네이션 UI 영역 -->
                <div class="pagination-container" id="paginationContainer"
                    style="display: flex; justify-content: center; gap: 8px; margin-top: 24px;">
                    <!-- 페이지 번호 버튼들이 동적으로 생성됩니다 -->
                </div>
                <!-- 상품 목록 리스트 -->
                <div class="product-list">
                </div>
            </section>
        </main>
    </div>
    <!-- 모달 창이 동적으로 삽입될 컨테이너 -->
    <div id="modal-container"></div>
    <!-- JS 파일 연결 -->
    <script src="./js/data_api.js"></script>
    <script src="./js/modal.js"></script>
</body>

</html>
